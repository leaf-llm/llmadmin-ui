services:
  app:
    build:
      context: .
      args:
        GATEWAY_REF: main
    ports:
      - "8700:8700"
    environment:
      NODE_ENV: production
      PORT: "8700"
      WEB_UI: "true"
      ENABLE_LEGACY_LOGS: "false"
      # File mode without a mounted volume: data is ephemeral and is lost when
      # the container is recreated. Add a volume (and point CONFIG_PATH at it)
      # or switch to PostgreSQL when persistence is required.
      CONFIG_STORE: file
      CONFIG_PATH: /tmp/llmadmin/conf.json
      USAGE_STORE: file
      HOME: /tmp/llmadmin
      CONFIG_CACHE_TTL_MS: "1000"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-dev-gateway-key}
